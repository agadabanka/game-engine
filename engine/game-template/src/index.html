<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Studio · Phaser 4 Game</title>
  <style>
    html,body{margin:0;height:100%;background:#0b1021;overflow:hidden;
      -webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none}
    #game{position:fixed;inset:0;width:100vw;height:100dvh;display:flex;align-items:center;justify-content:center}
    canvas{display:block;max-width:100%;max-height:100%}
    /* a landscape game fills best in landscape — nudge portrait phones to rotate */
    #rotate{display:none}
    @media (orientation:portrait) and (max-height:560px){
      #rotate{display:flex;position:fixed;inset:0;z-index:20;flex-direction:column;gap:14px;
        align-items:center;justify-content:center;background:#0b1021;color:#cfe0ff;
        font:600 19px/1.5 system-ui,-apple-system,sans-serif;text-align:center;padding:28px}
      #rotate .spin{font-size:54px;animation:tip 1.6s ease-in-out infinite}
      @keyframes tip{0%,100%{transform:rotate(0)}50%{transform:rotate(90deg)}}
      #game{filter:blur(3px) brightness(.5)}
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="rotate"><div class="spin">📱</div><div>Rotate your device to play</div></div>
  <script src="./vendor/phaser.min.js"></script>
  <script src="./vendor/studio.js"></script>
  <script src="./game/levels.js"></script>
  <script src="./game/game.js"></script>
</body>
</html>
