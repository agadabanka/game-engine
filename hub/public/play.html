<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FunStack Studios — Play Free Browser Games</title>
<meta name="description" content="Free browser games by FunStack Studios. Tap to play — no download." />
<style>
  :root{ --bg:#0a0f1e; --panel:#121a30; --line:#26314f; --ink:#e7edff; --dim:#9fb3e0; --blue:#3a7dff; --green:#5fd66e; }
  *{ box-sizing:border-box; } body{ margin:0; background:radial-gradient(900px 520px at 50% -10%,#16213f,#0a0f1e); color:var(--ink); font-family:system-ui,Segoe UI,Roboto,sans-serif; line-height:1.5; }
  .wrap{ max-width:560px; margin:0 auto; padding:34px 18px 70px; }
  header{ text-align:center; margin-bottom:24px; }
  header .logo{ font-size:30px; font-weight:900; letter-spacing:.3px; }
  header .logo .fs{ color:#ffd34d; }
  header p{ color:var(--dim); font-size:14px; margin:8px 0 0; }
  .games{ display:flex; flex-direction:column; gap:12px; }
  a.card{ display:flex; align-items:center; gap:14px; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:11px 13px; text-decoration:none; color:var(--ink); transition:border-color .12s, transform .12s; }
  a.card:hover{ border-color:var(--blue); transform:translateY(-2px); }
  a.card img{ width:74px; height:74px; border-radius:11px; object-fit:cover; background:#0e1730; flex:none; }
  a.card .meta{ flex:1; min-width:0; }
  a.card .nm{ font-size:17px; font-weight:800; display:block; }
  a.card .tg{ font-size:12.5px; color:var(--dim); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  a.card .play{ flex:none; background:var(--blue); color:#fff; font-weight:800; font-size:14px; border-radius:10px; padding:10px 16px; }
  .muted{ color:var(--dim); text-align:center; }
  footer{ text-align:center; color:var(--dim); font-size:12px; margin-top:30px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><span class="fs">Fun</span>Stack Studios</div>
    <p>Free browser games — tap to play, no download.</p>
  </header>
  <div class="games" id="games"><p class="muted">loading games…</p></div>
  <footer>Made by FunStack Studios · plays in your browser</footer>
</div>
<script>
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
  fetch('/api/games').then((r) => r.json()).then((d) => {
    const games = (d.games || []).filter((g) => g.url);
    if (!games.length) { document.getElementById('games').innerHTML = '<p class="muted">no games yet.</p>'; return; }
    document.getElementById('games').innerHTML = games.map((g) => {
      const thumb = '/thumbs/' + esc(g.id) + '.jpg';
      const tag = esc(g.tagline || (g.meta && g.meta.tagline) || '');
      // links go through /go/<id> so every play is counted server-side (UTM passes through)
      return '<a class="card" href="/go/' + esc(g.id) + '">' +
        '<img loading="lazy" src="' + thumb + '" alt="" onerror="this.style.visibility=\'hidden\'">' +
        '<span class="meta"><span class="nm">' + esc(g.name) + '</span><span class="tg">' + tag + '</span></span>' +
        '<span class="play">▶ Play</span></a>';
    }).join('');
  }).catch(() => { document.getElementById('games').innerHTML = '<p class="muted">could not load games.</p>'; });
</script>
</body>
</html>
