# Quality safety net (7.4): on any engine/SDK change, run the golden games' own gates
# against engine HEAD and block the merge on red — so one shared-SDK change can't
# silently break shipped games. Optimised to the golden set (fast, ~minutes).
#
# Requires a repo secret `GH_TOKEN` (a PAT with read access to the golden game repos),
# since the default GITHUB_TOKEN can't clone other private repos. Without it, golden
# games that can't be cloned are SKIPPED (not failed) — see tools/eval-all.mjs.
#
# After an intentional engine/template restyle the visual baselines drift. Refresh them
# from CI's own renderer either way:
#   • Actions → cross-game-eval → "Run workflow" with rebaseline=true, or
#   • push a commit whose message contains the marker [rebaseline].
# Either captures this run's screenshots as the new goldens and commits them — baselines
# MUST come from CI, since a different machine renders the frame slightly differently and
# would keep the gate red.
name: cross-game-eval
on:
  push:
    branches: [main]
    paths:
      - 'engine/sdk/**'
      - 'engine/game-template/**'
      - 'tools/eval-all.mjs'
      - 'tools/golden-games.json'
  pull_request:
    paths:
      - 'engine/sdk/**'
      - 'engine/game-template/**'
      - 'tools/eval-all.mjs'
      - 'tools/golden-games.json'
  workflow_dispatch:
    inputs:
      rebaseline:
        description: 'Capture this run''s screenshots as the new golden visual baselines and commit them (run after an intentional engine/template restyle).'
        type: boolean
        default: false

# default: read-only. The re-baseline path needs write to commit refreshed baselines.
permissions:
  contents: write

jobs:
  golden:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: SDK vendor copies in sync
        run: node scripts/sync-sdk.mjs --check
      - name: Unit tests (keystone · level-kit · gencache)
        run: node --test tools/lib/*.test.mjs
      - name: Cross-game eval — golden set vs engine HEAD
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: node tools/eval-all.mjs
      # Normal runs: compare this run's screenshots against the committed baselines.
      # Skipped on a re-baseline dispatch (where we're deliberately replacing them).
      - name: Visual QA — screenshots vs golden baselines
        if: ${{ !((github.event_name == 'workflow_dispatch' && inputs.rebaseline) || contains(github.event.head_commit.message, '[rebaseline]')) }}
        run: node tools/visual-qa.mjs
      # Re-baseline: accept THIS CI run's renders as the new baselines and commit them.
      # Captured in-CI so the baseline matches the environment the gate runs in — a
      # baseline captured elsewhere can drift against CI's renderer. Triggered by a
      # workflow_dispatch with rebaseline=true OR a commit message containing [rebaseline].
      - name: Re-baseline visual goldens (dispatch or [rebaseline] commit)
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.rebaseline) || contains(github.event.head_commit.message, '[rebaseline]') }}
        run: |
          node tools/visual-qa.mjs --update
          if git diff --quiet -- tools/golden-baselines; then
            echo "no baseline changes"; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tools/golden-baselines
          git commit -m "ci(visual-qa): re-baseline golden screenshots from CI render"
          git push
      - name: Upload eval board + scorecards
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-board
          path: |
            out/golden/eval-board.png
            out/golden/summary.json
            out/golden/*/out/scorecard.json
            out/golden/*/out/shot-*.png
          if-no-files-found: ignore
